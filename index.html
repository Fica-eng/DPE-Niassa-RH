<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Geracão de Expedientes - DPE Niassa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #003366; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #003366; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #002244; }
        #output { margin-top: 20px; white-space: pre-wrap; font-family: "Times New Roman", serif; background: #fff; padding: 20px; border: 1px solid #ddd; }
        .print-btn { background-color: #28a745; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Direccao Provincial de Educacão de Niassa</h2>
    <p><strong>Departamento de Recursos Humanos</strong> | Reparticao de Administracão e Gestão do Pessoal</p>
    <hr>

    <label for="apiKey">Chave de API do Google Gemini:</label>
    <input type="password" id="apiKey" placeholder="Cole sua chave Gemini API aqui...">

    <label for="docType">Tipo de Expediente/Documento:</label>
    <select id="docType">
        <option value="Resposta de Pedido de Disponibilidade de Vaga (Com Vaga)">Resposta de Pedido de Vaga (Com Vaga)</option>
        <option value="Resposta de Pedido de Disponibilidade de Vaga (Sem Vaga)">Resposta de Pedido de Vaga (Sem Vaga)</option>
        <option value="Informacão Proposta / Parecer de Transferência">Informacão Proposta / Parecer de Transferência</option>
        <option value="Guia de Marcha">Guia de Marcha</option>
        <option value="Devolucão de Processo com Pendências">Devolucão de Processo com Pendências</option>
        <option value="Requisicão de Material ao Património">Requisicão de Material ao Património</option>
    </select>

    <label for="destinatario">Destinatário (Ex: Gabinete do Governador, SDEJT de Lichinga, etc.):</label>
    <input type="text" id="destinatario" placeholder="Ex: Gabinete do Governador da Província do Niassa">

    <label for="dadosFuncionario">Dados do Funcionário / Descricão do Assunto:</label>
    <textarea id="dadosFuncionario" rows="4" placeholder="Ex: Lúcia de Nascimento Amós, NUIT 116285363, Docente N3, Classe C, Escalão 2..."></textarea>

    <button onclick="gerarDocumento()">Gerar Expediente com IA (Gemini)</button>

    <div id="resultArea" style="display:none;">
        <h3>Documento Gerado:</h3>
        <div id="output"></div>
        <button class="print-btn" onclick="imprimirDocumento()">Imprimir / Salvar como PDF</button>
    </div>
</div>

<script>
async function gerarDocumento() {
    const apiKey = document.getElementById('apiKey').value;
    const docType = document.getElementById('docType').value;
    const destinatario = document.getElementById('destinatario').value;
    const dadosFuncionario = document.getElementById('dadosFuncionario').value;
    const outputDiv = document.getElementById('output');

    if (!apiKey) {
        alert("Por favor, introduza a sua chave da API do Gemini.");
        return;
    }

    outputDiv.innerText = "A gerar documento...";
    document.getElementById('resultArea').style.display = "block";

    const prompt = `
    Você é um assistente administrativo do Departamento de Recursos Humanos (Repartição de Administração e Gestão do Pessoal) da Direcção Provincial de Educação de Niassa, Moçambique.
    
    Gere um documento oficial no formato padrão da República de Moçambique com os seguintes dados:
    - Cabeçalho Oficial:
      REPÚBLICA DE MOÇAMBIQUE
      PROVÍNCIA DO NIASSA
      DIRECÇÃO PROVINCIAL DA EDUCAÇÃO
      = Lichinga =
    - Tipo de documento: ${docType}
    - Destinatário: ${destinatario}
    - Detalhes do assunto/funcionário: ${dadosFuncionario}
    
    REGRA OBRIGATÓRIA DE ASSINATURA:
    O assinante final DEVE SER SEMPRE:
    O Director Provincial
    Matias Félix Chapungo
    / Especialista de Educação /
    
    NUNCA use "A Directora Provincial" ou "Alocre Saide". Mantenha o tom formal, conciso e administrativo moçambicano.
    `;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            outputDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
            outputDiv.innerText = "Erro ao gerar o documento. Verifique a chave de API.";
        }
    } catch (error) {
        outputDiv.innerText = "Erro de conexão: " + error.message;
    }
}

function imprimirDocumento() {
    const conteudo = document.getElementById('output').innerText;
    const win = window.open('', '', 'height=700,width=900');
    win.document.write('<html><head><title>Imprimir Expediente</title>');
    win.document.write('<style>body { font-family: "Times New Roman", serif; font-size: 12pt; padding: 40px; line-height: 1.5; }</style>');
    win.document.write('</head><body>');
    win.document.write('<pre style="font-family: inherit; white-space: pre-wrap;">' + conteudo + '</pre>');
    win.document.write('</body></html>');
    win.document.close();
    win.print();
}
</script>

</body>
</html>
